name: Deploy Python Azure Function

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Resolve dependencies and package
        shell: bash
        run: |
          cd ./azure-cloud-backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/python"
          zip -r ../release.zip .
          cd ..

      - name: Run Azure Functions Action
        uses: Azure/functions-action@v1
        with:
          app-name: 'fe1resumefunction'
          package: 'release.zip'
          publish-profile: ${{ secrets.AZURE_FUNCTION_PUBLISH_PROFILE }}