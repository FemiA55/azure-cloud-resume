name: Deploy Python Azure Function

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Package application source
        shell: bash
        run: |
          cd ./azure-cloud-backend
          zip -r ../release.zip . -x "*.git*" "*__pycache__*" "*.venv*"
          cd ..

      - name: Run Azure Functions Action
        uses: Azure/functions-action@v1
        with:
          app-name: 'fe1resumefunction'
          package: 'release.zip'
          publish-profile: ${{ secrets.AZURE_FUNCTION_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true