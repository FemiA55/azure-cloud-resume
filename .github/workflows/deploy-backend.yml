name: Deploy Azure Function Backend

on:
  push:
    branches:
      - main
  workflow_dispatch: # This adds a button to trigger it manually from GitHub!

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve dependencies
        shell: bash
        run: |
          pushd ./azure-cloud-backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/python"
          popd

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Azure Functions Action
        uses: Azure/functions-action@v1
        with:
          app-name: 'fe1resumefunction' # Replace this with your actual Azure Function App name
          package: './azure-cloud-backend'